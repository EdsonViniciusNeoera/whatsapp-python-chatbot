<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGDISK Ótica - Envio de Receita</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8B8B8C 0%, #A4A5A6 50%, #D7D9D9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #8B8B8C;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        
        .logo h1 {
            color: #FFFFFF;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #E0E0E0;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #FFFFFF;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D7D9D9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #FFFFFF;
        }
        
        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #D7D9D9;
            box-shadow: 0 0 0 3px rgba(215, 217, 217, 0.3);
        }
        
        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .file-upload-label {
            display: block;
            padding: 20px;
            background: #FFFFFF;
            border: 2px dashed #D7D9D9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-upload-label:hover {
            background: #F5F5F5;
            border-color: #A4A5A6;
        }
        
        .file-upload-label .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .file-upload-label .text {
            color: #666;
            font-size: 14px;
        }
        
        .file-upload-label .text strong {
            color: #8B8B8C;
        }
        
        .file-preview {
            margin-top: 15px;
            padding: 15px;
            background: #FFFFFF;
            border-radius: 10px;
            display: none;
        }
        
        .file-preview.show {
            display: block;
        }
        
        .file-preview .filename {
            color: #2e7d32;
            font-weight: 600;
            word-break: break-all;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #A4A5A6 0%, #8B8B8C 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 139, 140, 0.4);
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 139, 140, 0.6);
        }
        
        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        
        .info-box {
            background: #FFFFFF;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #A4A5A6;
        }
        
        .info-box p {
            color: #555555;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .required {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/logoGG.jpg" alt="GGDISK Ótica">
        </div>
        
        <div class="info-box">
            <p>📋 Por favor, envie sua receita de óculos (foto ou PDF).</p>
        </div>
        
        <div id="message" class="message"></div>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="hidden" id="phone" name="phone">
            <input type="hidden" id="name" name="name" value="Cliente">
            
            <div class="form-group">
                <label for="prescription">Receita de Óculos <span class="required">*</span></label>
                <div class="file-upload">
                    <input 
                        type="file" 
                        id="prescription" 
                        name="prescription" 
                        accept="image/*,.pdf"
                        required
                    >
                    <label for="prescription" class="file-upload-label">
                        <div class="icon">📸</div>
                        <div class="text">
                            <strong>Clique aqui</strong> para escolher<br>
                            <small>Foto ou PDF (máx. 10MB)</small>
                        </div>
                    </label>
                </div>
                <div id="filePreview" class="file-preview">
                    <div class="filename">✅ Arquivo selecionado: <span id="fileName"></span></div>
                </div>
            </div>
            
            <button type="submit" id="submitBtn">
                📤 Enviar Receita
            </button>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('prescription');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        // Pegar dados da URL (phone e opcionalmente name)
        const urlParams = new URLSearchParams(window.location.search);
        const phoneParam = urlParams.get('phone');
        const nameParam = urlParams.get('name') || 'Cliente';
        
        if (phoneParam) {
            document.getElementById('phone').value = phoneParam;
            document.getElementById('name').value = nameParam;
        } else {
            showMessage('❌ Link inválido. Por favor, use o link enviado pelo WhatsApp.', 'error');
            submitBtn.disabled = true;
        }
        
        // Mostrar preview do arquivo selecionado
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                fileName.textContent = file.name;
                filePreview.classList.add('show');
                
                // Validar tamanho (10MB max)
                if (file.size > 10 * 1024 * 1024) {
                    showMessage('Arquivo muito grande! Máximo 10MB.', 'error');
                    this.value = '';
                    filePreview.classList.remove('show');
                }
            } else {
                filePreview.classList.remove('show');
            }
        });
        
        // Submeter formulário
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validar telefone
            const phone = document.getElementById('phone').value.replace(/\D/g, '');
            if (!phone || phone.length < 10 || phone.length > 11) {
                showMessage('❌ Link inválido. Por favor, use o link enviado pelo WhatsApp.', 'error');
                return;
            }
            
            // Validar arquivo
            if (!fileInput.files || !fileInput.files[0]) {
                showMessage('Por favor, selecione um arquivo!', 'error');
                return;
            }
            
            // Desabilitar botão
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Enviando...';
            
            // Preparar dados
            const formData = new FormData();
            formData.append('phone', phone);
            formData.append('name', document.getElementById('name').value);
            formData.append('prescription', fileInput.files[0]);
            
            try {
                const response = await fetch('/upload_prescription', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('✅ Receita enviada com sucesso! Você receberá uma confirmação no WhatsApp em instantes.', 'success');
                    form.reset();
                    filePreview.classList.remove('show');
                    
                    // Mostrar mensagem adicional
                    setTimeout(() => {
                        showMessage('📱 Aguarde a confirmação no WhatsApp. Nosso consultor entrará em contato em breve!', 'success');
                    }, 2000);
                    
                    // Redirecionar para WhatsApp após 5 segundos (opcional)
                    setTimeout(() => {
                        if (confirm('Deseja voltar ao WhatsApp agora?')) {
                            window.location.href = 'https://wa.me/' + phone;
                        }
                    }, 5000);
                } else {
                    showMessage('❌ Erro: ' + (result.message || 'Erro ao enviar receita.'), 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('❌ Erro ao enviar receita. Tente novamente.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 Enviar Receita';
            }
        });
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message show ' + type;
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
